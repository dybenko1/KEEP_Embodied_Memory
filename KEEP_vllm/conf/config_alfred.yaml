name: alfred

defaults:
  - hydra: default.yaml
  - planner: default.yaml

out_dir: ${hydra:run.dir}

prompt:
  num_examples: 6
  splitter: ""
  prefix: "Robot: Hi there, I'm a robot operating in a home.\nRobot: You can ask me to do various tasks and I'll tell you the sequence of actions I would do to accomplish your task. Here are some rules I need to remeber: 1. Before put down something, I need to first find the place to put down. 2. I can only hold one thing at each time. 3. When I need to slice something, I need to first find and pick up the knife, then find and slice the target object.\n"
  example_file_path: "resource/alfred_examples_for_prompt.json"
# When I need to slice something, I need to first find and pick up the knife, then find and slice the target object.
alfred:
  x_display: '10'
  eval_set: 'valid_seen'  # valid_seen, valid_unseen
  eval_portion_in_percent: 100  # use a small set for a faster evaluationin. 100 means a full set.
  random_seed_for_eval_subset: 1
