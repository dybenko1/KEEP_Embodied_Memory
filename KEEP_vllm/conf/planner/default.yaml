model_name: "YOUR/PLANNER_MODEL/PATH"

use_accelerate_device_map: False
load_in_8bit: False
load_in_4bit: False
device: 'cuda:0'
max_steps: 25
random_seed: 0
scoring_batch_size: 4
score_function: 'sum'
scoring_mode: 'reuse_prompt'  # naive, reuse_prompt, guidance
use_predefined_prompt: False  # NOTE: This uses a pre-defined prompt, and you can put a failure message in the prompt.
hf_auth_token: ''  # NOTE: this is required for downloading the private model from HuggingFace
openai_api_key: ''  # NOTE: this is required for using the OpenAI API
use_kv: True  # NOTE: This is used for the key-value memory mechanism, which is useful for large models.
use_memory: True  # NOTE: This is used for the memory mechanism, which is useful for small models.
use_static_memory: True
use_vllm: True
